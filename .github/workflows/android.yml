name: Android CI

on:
  push:
    branches: [ "dev", "main" ]

  pull_request:
    branches: [ "dev", "main" ]


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true



jobs:


  assemble-debug:

    name: Assemble Debug APK

    runs-on: ubuntu-latest


    permissions:
      contents: read


    steps:


      - name: Checkout
        uses: actions/checkout@v5



      - name: Setup JDK 17
        uses: actions/setup-java@v5

        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle



      - name: Make gradlew executable
        run: chmod +x gradlew



      - name: Build Debug APK
        run: ./gradlew --no-daemon app:assembleDebug



      - name: Upload Debug APK
        uses: actions/upload-artifact@v4

        with:
          name: VibeApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk





  unit-tests:


    name: Unit Tests

    runs-on: ubuntu-latest



    permissions:
      contents: read



    steps:



      - name: Checkout
        uses: actions/checkout@v5




      - name: Setup JDK 17

        uses: actions/setup-java@v5

        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle




      - name: Make gradlew executable

        run: chmod +x gradlew




      - name: Run Tests

        run: ./gradlew --no-daemon app:testDebugUnitTest






  android-lint:


    name: Android Lint

    runs-on: ubuntu-latest



    permissions:
      contents: read



    steps:



      - name: Checkout

        uses: actions/checkout@v5




      - name: Setup JDK 17

        uses: actions/setup-java@v5

        with:

          java-version: "17"
          distribution: "temurin"
          cache: gradle




      - name: Make gradlew executable

        run: chmod +x gradlew




      - name: Run Lint

        run: ./gradlew --no-daemon app:lintDebug
